name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Container
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${{ github.sha }} \
            --region asia-east1 .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy filmfolio-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${{ github.sha }} \
            --region asia-east1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars MONGO_URI='${{ secrets.MONGO_URI }}',JWT_SECRET='${{ secrets.JWT_SECRET }}',TMDB_API_KEY='${{ secrets.TMDB_API_KEY }}'
